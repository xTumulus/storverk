server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Generated from content/site.config.yaml at build time — see
    # scripts/build-nginx-config.ts. Contains the Strict-Transport-Security
    # header (or a note that HSTS is disabled).
    include /etc/nginx/security-headers.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # NOTE: if you run this behind a separate reverse proxy (Caddy, Traefik,
    # another nginx) that also terminates TLS, make sure only one layer sets
    # the HSTS/security headers above to avoid duplicates.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # vite-ssg's "flat" output style writes one .html file per route
    # (e.g. /github -> github.html), so a request with no file extension
    # needs the second try_files fallback below to find its page.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # media/ is a separately-mounted, independently-edited directory (see
    # docker-compose.yml) — not part of any prerendered release — so it's
    # served from a fixed path via `alias` rather than living inside
    # `root`, which scripts/rebuild-site.ts atomically repoints between
    # release directories on every content change.
    location /media/ {
        alias /app/media/;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
